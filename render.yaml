# Lets Render (render.com) run the Flaux VR server from this repository:
# New, Blueprint, pick this repository, Apply.  See vr/server/README.md.
services:
  - type: web
    name: flaux-vr-server
    runtime: node
    plan: free
    rootDir: vr/server
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /
