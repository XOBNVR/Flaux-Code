name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish FlauxSetup.exe as a GitHub release

concurrency:          # two quick pushes in a row: only the newest one runs to the end
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc and SDL2
        run: sudo apt-get update && sudo apt-get install -y gcc libsdl2-dev
      - name: Run all tests
        run: python3 tests/run_tests.py
      - name: Install a browser for the block editor test
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Test the block editor (every program through blocks and back)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: python3 tests/blocks_roundtrip.py

  windows:
    name: Tests and installer on Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather Python, gcc and SDL2
        shell: pwsh
        run: ./installer/fetch-windows-parts.ps1

      - name: Run all tests on Windows
        shell: pwsh
        env:
          FLAUX_TOOLS: ${{ github.workspace }}\build\app
        run: |
          & build\app\python\python.exe tests\run_tests.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build FlauxSetup.exe
        id: build
        shell: pwsh
        run: |
          $version = & build\app\python\python.exe -c "import sys; sys.path.insert(0, '.'); import flauxc; print(flauxc.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$version" installer\flaux.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\FlauxSetup.exe | Format-List Name, Length

      - name: Install it and use it like a beginner would
        shell: pwsh
        run: ./installer/try-installed.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: FlauxSetup
          path: dist/FlauxSetup.exe

  web:
    name: Flaux Studio on the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Pyodide (Python for web pages) and a browser for testing
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright pyodide@314.0.7
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Test the web version of Flaux (every test program, run with Node)
        run: python3 tests/js_tests.py
      - name: Build the website
        run: python3 -m flauxc.web.build site --pyodide "$RUNNER_TEMP/pw/node_modules/pyodide"
      - name: Test Flaux Studio on the web in a browser
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          python3 -m http.server --directory site 8790 --bind 127.0.0.1 &
          sleep 1
          node tests/web_studio_test.js http://127.0.0.1:8790/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Puts Flaux Studio on the web at https://xobnvr.github.io/Flaux-Code/
  # (needs GitHub Pages switched on: Settings, Pages, Source: GitHub Actions)
  deploy-web:
    name: Put Flaux Studio on the web
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Every change to main that passes everything above, on Linux AND Windows,
  # becomes the README's download: release v<version>, with FlauxSetup.exe.
  release:
    name: Publish the installer
    needs: [linux, windows, web]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(python3 -c 'import flauxc; print(flauxc.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FlauxSetup
          path: dist
      - name: Publish FlauxSetup.exe as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flaux ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/FlauxSetup.exe
          body: |
            ## Install Flaux on Windows

            1. Download **FlauxSetup.exe** below.
            2. Double-click it. If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (Flaux is new and not signed by a big company yet).
            3. Click **Next** until it's done, then **Finish**. Flaux Studio opens.

            Everything is included: Python, a C compiler and SDL2 graphics. No administrator needed. Works on Windows 10 and 11 (64-bit).

            See the [README](https://github.com/XOBNVR/Flaux-Code#readme) for the lessons.

            _Built and tested automatically: every test passed on Windows and Linux (including the block editor), and this exact installer was installed and tried out before being published._
