name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish FlauxSetup.exe as a GitHub release

concurrency:          # two quick pushes in a row: only the newest one runs to the end
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc and SDL2
        run: sudo apt-get update && sudo apt-get install -y gcc libsdl2-dev
      - name: Run all tests
        run: python3 tests/run_tests.py
      - name: Install a browser for the block editor test
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Test the block editor (every program through blocks and back)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: python3 tests/blocks_roundtrip.py

  windows:
    name: Tests and installer on Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather Python, gcc and SDL2
        shell: pwsh
        run: ./installer/fetch-windows-parts.ps1

      - name: Run all tests on Windows
        shell: pwsh
        env:
          FLAUX_TOOLS: ${{ github.workspace }}\build\app
        run: |
          & build\app\python\python.exe tests\run_tests.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build FlauxSetup.exe
        id: build
        shell: pwsh
        run: |
          $version = & build\app\python\python.exe -c "import sys; sys.path.insert(0, '.'); import flauxc; print(flauxc.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=$version" installer\flaux.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\FlauxSetup.exe | Format-List Name, Length

      - name: Make FlauxStudio-windows.zip (Flaux Studio without installing)
        shell: pwsh
        run: |
          $folder = "build\portable\Flaux Studio"
          New-Item -ItemType Directory -Force build\portable | Out-Null
          Copy-Item -Recurse build\app $folder
          Set-Content "$folder\Start here.txt" -NoNewline -Value ("Flaux Studio`r`n============`r`n`r`n" +
            "Double-click Flaux Studio.exe to start Flaux Studio. Nothing needs to be installed:`r`n" +
            "keep this whole folder together (Flaux Studio.exe uses the files next to it).`r`n`r`n" +
            "Your programs are saved in Documents\Flaux. To have Start menu and Desktop icons,`r`n" +
            "and to type ``flaux`` in Command Prompt, install Flaux with FlauxSetup.exe instead.`r`n")
          7z a -tzip -mx=7 dist\FlauxStudio-windows.zip ".\build\portable\Flaux Studio" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\FlauxStudio-windows.zip | Format-List Name, Length

      - name: Install it and use it like a beginner would
        shell: pwsh
        run: ./installer/try-installed.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: FlauxSetup
          path: dist/FlauxSetup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FlauxStudio-windows
          path: dist/FlauxStudio-windows.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-window
          path: dist/studio-window.png
          if-no-files-found: ignore

  web:
    name: Flaux Studio on the web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Pyodide (Python for web pages) and a browser for testing
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright pyodide@314.0.7
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Test the web version of Flaux (every test program, run with Node)
        run: python3 tests/js_tests.py
      - name: Build the website
        run: python3 -m flauxc.web.build site --pyodide "$RUNNER_TEMP/pw/node_modules/pyodide"
      - name: Test Flaux Studio on the web in a browser
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          python3 -m http.server --directory site 8790 --bind 127.0.0.1 &
          sleep 1
          node tests/web_studio_test.js http://127.0.0.1:8790/
      - name: Zip the website (to upload to any website)
        run: cd site && zip -r -9 -q ../FlauxStudio-web.zip . && ls -l ../FlauxStudio-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FlauxStudio-web
          path: FlauxStudio-web.zip

  # Every change to main that passes everything above, on Linux AND Windows,
  # becomes the README's download: release v<version>, with FlauxSetup.exe
  # and FlauxStudio-web.zip (Flaux Studio for your own website).
  release:
    name: Publish the installer
    needs: [linux, windows, web]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(python3 -c 'import flauxc; print(flauxc.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: FlauxSetup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: FlauxStudio-web
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: FlauxStudio-windows
          path: dist
      - name: Publish FlauxSetup.exe as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flaux ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/FlauxSetup.exe
            dist/FlauxStudio-windows.zip
            dist/FlauxStudio-web.zip
          body: |
            ## Install Flaux on Windows

            1. Download **FlauxSetup.exe** below.
            2. Double-click it. If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (Flaux is new and not signed by a big company yet).
            3. Click **Next** until it's done, then **Finish**. Flaux Studio opens.

            Everything is included: Python, a C compiler and SDL2 graphics. No administrator needed. Works on Windows 10 and 11 (64-bit).

            Flaux Studio is a real Windows app (Flaux Studio.exe, in its own window), and its **Export** button makes a .zip with your program as a **.exe** that anyone can double-click.

            ## Or without installing

            **FlauxStudio-windows.zip** is the same Flaux Studio, ready to go: unzip it anywhere and double-click **Flaux Studio.exe** inside.

            See the [README](https://github.com/XOBNVR/Flaux-Code#readme) for the lessons.

            ## Flaux Studio for your website

            **FlauxStudio-web.zip** is Flaux Studio as a website: unzip it and upload everything inside to any web host. Its CLAUDE.md explains each file and how to host it.

            _Built and tested automatically: every test passed on Windows and Linux (including the block editor), this exact installer was installed and tried out (Flaux Studio.exe opened and ran a program, from the installer and from the zip), and the website was tested in a real browser before being published._
